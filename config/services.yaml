# ---------------------------------------------------------------------------
# Container list (Homepage, FreshRSS, JDownloader). Each card is bound to a
# running container via the
# `my-docker` server defined in docker.yaml, so Homepage shows live container
# state plus per-container CPU/RAM stats.
# ---------------------------------------------------------------------------
- Infrastructure:
    - Homepage:
        icon: mdi-view-dashboard
        href: "http://localhost:3000"
        description: "This dashboard"
        server: my-docker
        container: homepage
    - FreshRSS:
        icon: freshrss.png
        href: "http://localhost:8080"
        description: "RSS aggregator"
        server: my-docker
        container: freshrss
    - JDownloader 2:
        icon: jdownloader.png
        href: "http://localhost:5800"
        description: "Web Download Manager"
        server: my-docker
        container: jdownloader-2
        widget:
          type: jdownloader
          username: "{{HOMEPAGE_VAR_JD_USERNAME}}"
          password: "{{HOMEPAGE_VAR_JD_PASSWORD}}"
          device: "JDownloader@Admin"

    # Written by the MusicBee plugin in musicbee-plugin/ -> status API.
    - Now Playing:
        icon: mdi-music-circle
        description: MusicBee
        widget:
          type: customapi
          url: "{{HOMEPAGE_VAR_STATUS_API}}/now-playing"
          refreshInterval: 5000
          display: list
          mappings:
            - field: title
              label: Track
            - field: artist
              label: Artist
            - field: album
              label: Album
            - field: status_line
              label: Status

    # voidtools Everything 1.5 HTTP server -> status API /everything.
    # Homepage sends username/password as Basic auth; the status API forwards
    # it to Everything and stores nothing. Options ride on the query string:
    #   url      Everything HTTP server (as seen from the host)
    #   exclude  paths to skip, ';'-separated (omit for the built-in defaults)
    #   huge     "huge file" threshold for Everything's size: filter
    - Everything:
        icon: mdi-file-search
        description: File index
        widgets:
          - type: customapi
            url: "{{HOMEPAGE_VAR_STATUS_API}}/everything?url=http://host.docker.internal:8089&huge=2gb&exclude=C:%5CUsers%5CAdmin%5CAppData%5C;C:%5CProgramData%5C;C:%5CWindows%5C;$Recycle.Bin;%5C.git%5C;C:%5CUsers%5CAdmin%5C.claude%5C;C:%5CProgram%20Files%20(x86)%5CSteam%5Cappcache%5C;%5C__pycache__%5C;status-api.log;%5CGoogleUpdater%5C;%5C.pytest_cache%5C"
            username: "{{HOMEPAGE_VAR_EVERYTHING_USER}}"
            password: "{{HOMEPAGE_VAR_EVERYTHING_PASS}}"
            refreshInterval: 60000
            mappings:
              - field: indexed_label
                label: Indexed
              - field: changed_today_label
                label: Today
              - field: huge_label
                label: Huge
              - field: downloads_label
                label: Downloads
          - type: customapi
            url: "{{HOMEPAGE_VAR_STATUS_API}}/everything?url=http://host.docker.internal:8089&huge=2gb&exclude=C:%5CUsers%5CAdmin%5CAppData%5C;C:%5CProgramData%5C;C:%5CWindows%5C;$Recycle.Bin;%5C.git%5C;C:%5CUsers%5CAdmin%5C.claude%5C;C:%5CProgram%20Files%20(x86)%5CSteam%5Cappcache%5C;%5C__pycache__%5C;status-api.log;%5CGoogleUpdater%5C;%5C.pytest_cache%5C"
            username: "{{HOMEPAGE_VAR_EVERYTHING_USER}}"
            password: "{{HOMEPAGE_VAR_EVERYTHING_PASS}}"
            refreshInterval: 60000
            display: dynamic-list
            mappings:
              items: items
              name: name
              label: label
