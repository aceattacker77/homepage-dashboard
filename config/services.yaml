---
# For configuration options and examples, please see:
# https://gethomepage.dev/configs/services/

# ---------------------------------------------------------------------------
# Hermes agent status. All five widgets are Custom API widgets backed by the
# local read-only status API (C:/Users/Admin/docker/homepage/status-api).
# The base URL comes from HOMEPAGE_VAR_STATUS_API in docker-compose.yml --
# widgets are fetched server-side from inside the container, so "localhost"
# would resolve to the container itself, hence host.docker.internal.
# ---------------------------------------------------------------------------
- Hermes Agents:
    - Agent Status:
        icon: mdi-robot
        description: Worker + builder liveness, last activity
        widget:
          type: customapi
          url: "{{HOMEPAGE_VAR_STATUS_API}}/hermes-status"
          refreshInterval: 15000
          display: list
          mappings:
            - field: worker_summary
              label: Worker
            - field: builder_summary
              label: Builder
            - field: agents_online
              label: Online

    - OpenRouter Credits:
        icon: mdi-currency-usd
        description: Current OpenRouter balance
        widget:
          type: customapi
          url: "{{HOMEPAGE_VAR_STATUS_API}}/openrouter-credits"
          refreshInterval: 120000
          mappings:
            - field: remaining_label
              label: Remaining
            - field: used_label
              label: Used
            - field: used_percent_label
              label: Usage

    - Cron Jobs:
        icon: mdi-clock-outline
        description: Hermes cron schedule and last run result
        widget:
          type: customapi
          url: "{{HOMEPAGE_VAR_STATUS_API}}/cron-status"
          refreshInterval: 60000
          display: dynamic-list
          mappings:
            items: jobs
            name: name
            label: summary
            limit: 5

    - GPU:
        icon: si-nvidia
        description: Host GPU via nvidia-smi
        widget:
          type: customapi
          url: "{{HOMEPAGE_VAR_STATUS_API}}/gpu-status"
          refreshInterval: 10000
          mappings:
            - field: utilization_label
              label: GPU
            - field: vram_label
              label: VRAM
            - field: temperature_label
              label: Temp
            - field: power_label
              label: Power

# ---------------------------------------------------------------------------
# Mind: what Hermes and I have been learning. Both new cards are Custom API
# widgets on the status API (see status-api/README.md).
# ---------------------------------------------------------------------------
- Mind:
    - Skills Learned:
        icon: mdi-school-outline
        description: New Hermes skills per week
        widget:
          type: customapi
          url: "{{HOMEPAGE_VAR_STATUS_API}}/skills-learned"
          refreshInterval: 300000
          display: list
          mappings:
            - field: this_week
              label: This week
            - field: last_week
              label: Last week
            - field: total
              label: Learned
            - field: trend
              label: 8 weeks
            - field: latest_label
              label: Latest

    - Second Brain:
        icon: mdi-brain
        href: "obsidian://open?vault=second-brain"
        description: Note of the day
        widget:
          type: customapi
          url: "{{HOMEPAGE_VAR_STATUS_API}}/second-brain"
          refreshInterval: 300000
          display: dynamic-list
          mappings:
            items: items
            name: name
            label: label
            limit: 3
            target: "{href}"

    - Headlines:
        icon: si-rss
        description: Latest headlines from rss_feeds.json
        widget:
          type: customapi
          url: "{{HOMEPAGE_VAR_STATUS_API}}/rss-digest"
          refreshInterval: 600000
          display: dynamic-list
          mappings:
            items: items
            name: name
            label: label
            limit: 6
            target: "{link}"

# ---------------------------------------------------------------------------
# YouTube uploads, one Custom API card per channel.
#
# NOTE: Homepage has no native RSS/YouTube widget (verified against
# src/widgets/ and src/components/widgets/ at v2.3.0 and dev -- the only
# rss-ish entry is the unrelated "freshrss" service widget), so these use the
# Custom API widget. Channel IDs were each resolved from the live channel page
# and confirmed against the name YouTube's own feed reports; the card title is
# that verified channel name, so a wrong ID would be visible here.
#
# Dashboard-only: separate from rss_feeds.json and the digest pipeline.
# ---------------------------------------------------------------------------
- YouTube:
    - Asmongold TV:
        icon: si-youtube
        description: "@AsmonTV · uploads"
        widget:
          type: customapi
          url: "{{HOMEPAGE_VAR_STATUS_API}}/youtube-feeds?channel=asmongold"
          refreshInterval: 600000
          display: dynamic-list
          mappings:
            items: items
            name: name
            label: label
            limit: 5
            target: "https://www.youtube.com/watch?v={video_id}"

    - Patrick Boyle:
